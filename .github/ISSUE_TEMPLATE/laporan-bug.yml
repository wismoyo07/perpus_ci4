name: Laporan Bug
description: Laporkan fitur yang tidak berjalan sebagaimana mestinya.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. Celah keamanan jangan dilaporkan di sini; gunakan **Security → Report a vulnerability**.
  - type: textarea
    id: deskripsi
    attributes:
      label: Apa yang terjadi?
      description: Jelaskan masalahnya secara singkat.
    validations:
      required: true
  - type: textarea
    id: langkah
    attributes:
      label: Langkah mengulang
      placeholder: |
        1. Login sebagai staff
        2. Buka menu ...
        3. Klik ...
    validations:
      required: true
  - type: textarea
    id: harapan
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: input
    id: versi
    attributes:
      label: Versi aplikasi
      placeholder: "contoh: v1.7.0"
    validations:
      required: true
  - type: input
    id: lingkungan
    attributes:
      label: PHP, MySQL, dan server
      placeholder: "contoh: PHP 8.2, MySQL 8.0, shared hosting cPanel"
  - type: textarea
    id: log
    attributes:
      label: Screenshot atau log
      description: Lampirkan screenshot, atau salin pesan error dari writable/logs/ (hapus data pribadi).
